# Pond configuration. Every setting is described in
# https://github.com/FrogPak/engine/blob/main/docs/configuration.md

pond:
  title: AJHub
  subtitle: AJ's Flatpak Repository
  remote: ajhub                  # unchanged, so existing users keep receiving updates
  logo-square: assets/logo.png
  #favicon: assets/logo.png
  order: name

apps:
  # Each release has <AppName>-<arch>-latest.flatpak files, made by the app's
  # own release workflow; {name} is the last part of the app ID.
  net.dunevent.Barkeep:
    repo: ajdunevent/Barkeep
    assets: "*-{arch}.flatpak"
  net.dunevent.Cajole:
    repo: ajdunevent/Cajole
    assets: "*-{arch}.flatpak"
  #net.dunevent.Lithidion:
  #  repo: ajdunevent/Lithidion
  #net.dunevent.Paradon:
  #  repo: ajdunevent/Paradon
  #net.dunevent.Phodder:
  #  repo: ajdunevent/Phodder
  #net.dunevent.Ralf:
  #  repo: ajdunevent/Ralf
  net.dunevent.Ringmaster:
    repo: ajdunevent/Ringmaster
  net.dunevent.Ripples:
    repo: ajdunevent/Ripples
    assets: "*-{arch}.flatpak"
  net.dunevent.Salutations:
    repo: ajdunevent/Salutations
  net.dunevent.Sanctum:
    repo: ajdunevent/Sanctum
    assets: "*-{arch}.flatpak"

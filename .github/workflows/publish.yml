name: Publish

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [release-published]
  push:
    branches: [main]
    paths: [apps.txt, scripts/**, .github/workflows/publish.yml]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y flatpak ostree gnupg

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          gpg --batch --import <<< "$GPG_PRIVATE_KEY"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Download latest bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir bundles
          while read -r repo prefix; do
            [[ -z "$repo" || "$repo" == \#* ]] && continue
            gh release download --repo "$repo" --pattern "${prefix}-*-latest.flatpak" --dir bundles \
              || echo "::warning::No release bundles found for $repo; skipping."
          done < apps.txt

      - name: Build repository
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          scripts/build-repo.sh bundles "$RUNNER_TEMP/repo" \
            "https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/repo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
